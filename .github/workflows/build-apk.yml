name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OpenCode-Viewer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Viewer.apk
          path: OpenCode-Viewer.apk